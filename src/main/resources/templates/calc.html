<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Расчет характеристик и сборов</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<a th:href="@{/}" class="btn btn-secondary mb-4">&larr; На главную</a>

<div class="card p-4 shadow-sm">
    <h2 class="mb-3">Расчет характеристик и сборов</h2>
    <p class="text-muted">Раздел расчета сборов и параметров фильмотеки.</p>

    <hr>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="p-3 border bg-light rounded">
                <h5>Всего фильмов</h5>
                <p class="fs-4 fw-bold" th:text="${moviesCount}">0</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 border bg-light rounded">
                <h5>Общие сборы</h5>
                <p class="fs-4 fw-bold">$<span th:text="${totalBoxOffice}">0</span> млн</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="p-3 border bg-light rounded">
                <h5>Средние сборы</h5>
                <p class="fs-4 fw-bold">$<span th:text="${#numbers.formatDecimal(avgBoxOffice, 1, 2)}">0</span> млн</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
