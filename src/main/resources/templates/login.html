<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { width: 320px; margin: 0 auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; }
        input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .link { text-align: center; margin-top: 10px; }
        .error { color: red; text-align: center; }
        .success { color: green; text-align: center; }
    </style>
</head>
<body>
<div class="container">
    <h2>Вход в сервис</h2>
    <div th:if="${param.error}" class="error">Неверный логин или пароль</div>
    <div th:if="${param.registered}" class="success">Регистрация успешна! Войдите.</div>
    <form th:action="@{/login}" method="post">
        <label>Логин:</label>
        <input type="text" name="username" required>
        <label>Пароль:</label>
        <input type="password" name="password" required>
        <button type="submit">Войти</button>
    </form>
    <div class="link">
        <a th:href="@{/register}">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>
</body>
</html>
