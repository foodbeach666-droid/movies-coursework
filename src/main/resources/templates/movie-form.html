<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форма фильма</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

<a th:href="@{/movies}" class="btn btn-secondary mb-4">&larr; Назад к списку</a>

<div class="card p-4 shadow-sm" style="max-width: 600px; margin: 0 auto;">
    <h2 class="mb-3" th:text="${movie.id != null} ? 'Редактировать фильм' : 'Добавить фильм'">Фильм</h2>

    <form th:action="${movie.id != null} ? @{/movies/edit/{id}(id=${movie.id})} : @{/movies/add}" th:object="${movie}" method="post">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label for="title" class="form-label">Название фильма</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="genre" class="form-label">Жанр</label>
            <input type="text" id="genre" th:field="*{genre}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="releaseYear" class="form-label">Год выпуска</label>
            <input type="number" id="releaseYear" th:field="*{releaseYear}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label for="boxOffice" class="form-label">Кассовые сборы ($ млн)</label>
            <input type="number" step="0.1" id="boxOffice" th:field="*{boxOffice}" class="form-control" />
        </div>

        <div class="mb-3">
            <label for="createdBy" class="form-label">Создатель / Автор</label>
            <input type="text" id="createdBy" th:field="*{createdBy}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>

</body>
</html>
